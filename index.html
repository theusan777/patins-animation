<!DOCTYPE html>
<html lang="pt_Br">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snitap Patins</title>

  <link rel="stylesheet" href="styles/index.css">

  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,500;1,14..32,500&family=Montserrat:ital,wght@0,700;1,700&family=Syne:wght@400..800&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <a href="#">
      <img src="assets/logo.svg" alt="Logo Snitap Patins">
    </a>

     <a href="#">
      <img src="assets/icons/shopping-bag-01.svg" alt="Ícone de carrinho de compras">
      <span>1</span>
    </a>
  </header>

  <section class="hero">
    <div>
      <h1>
        Snitap, sua vida mais
        <div>
          <span>radical</span>
          <span>divertida</span>
          <span>saudável</span>
          <span>radical</span>
        </div>
      </h1>

      <div class="buttons">
        <a href="#" class="button buy shadow">
          <img src="assets/icons/shopping-bag-01.svg" alt="Ícone de carrinho de compras">
          Comprar agora
        </a>
        
        <a href="#" class="button play">
          <span class="shadow">
            <img src="assets/icons/play.svg" alt="">
          </span>
          VEJA EM AÇÃO
        </a>
      </div>
    </div>

    <div>
      <div class="content">
        <img src="assets/hero/Ellipse.svg" alt="Elipse decorativa">
        <img src="assets/hero/patins-image.png" alt="Patins modelo Snitap na cor preta com detalhes em azul">
        <img src="assets/hero/Stars 1.svg" alt="">

      </div>
    </div>
